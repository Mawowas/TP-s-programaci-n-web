<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Turismo</title>
    <link rel="stylesheet" href="../css/registrarse.css">
</head>
<body>

    <header class="navbar-registro">
        <a href="../index.html" class="btn-volver">← Volver al inicio</a>
        <div class="modo_oscuro">
            <button id="boton" class="boton">🌙</button>
        </div>
    </header>

    <main class="registro-container">
        <div class="registro-card">
            <h2>Crear Cuenta</h2>
            <p class="subtitulo">Únete para planificar tus próximas vacaciones</p>

            <form class="registro-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Matias Ferreyra" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <div class="registro-footer">
                <p>¿Ya tienes una cuenta? <a href="#">Iniciar sesión</a></p>
            </div>
        </div>
    </main>

    <script src="../js/oscuro.js"></script>
</body>
</html>
